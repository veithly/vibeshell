<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">VibeShell: built for AI, made for you</title>
  <desc id="description">Connect existing AI tools through a Skill and native CLI. Share visible SSH sessions, manage servers and files, and work hands-on in one terminal workspace.</desc>
  <rect width="1200" height="300" rx="16" fill="#101319"/>
  <g transform="translate(42 44) scale(.18)">
    <rect width="512" height="512" rx="108" fill="#111016"/>
    <rect x="18" y="18" width="476" height="476" rx="94" fill="none" stroke="#2b2540" stroke-width="4"/>
    <path d="M132 150 256 350 380 150" fill="none" stroke="#f7f7f5" stroke-width="52" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="344" y="316" width="58" height="58" rx="17" fill="#5eead4"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="155" y="112" font-size="64" font-weight="700" letter-spacing="-2" fill="#e9edf4">VibeShell</text>
    <text x="46" y="188" font-size="34" font-weight="500" fill="#e9edf4">Built for AI. Made for you.</text>
    <text x="46" y="237" font-size="24" fill="#bac7db">AI tools · SSH · SFTP · Server management</text>
  </g>
  <path d="M742 101H797V150H845M742 199H797V150" fill="none" stroke="#354052" stroke-width="3"/>
  <circle cx="797" cy="150" r="5" fill="#8dcfdf"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24">
    <text x="616" y="109" fill="#8dcfdf">You</text>
    <text x="616" y="207" fill="#cea6ed">Agent</text>
    <text x="863" y="146" fill="#e9edf4">session:001</text>
    <text x="863" y="185" fill="#bac7db">$</text>
    <rect x="890" y="166" width="11" height="23" fill="#a8bfff"/>
  </g>
</svg>
