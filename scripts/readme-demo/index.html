<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' ipc: http://ipc.localhost ws://127.0.0.1:1421; img-src 'self' data: blob:; font-src 'self' data:;" />
    <title>VibeShell · isolated documentation demo</title>
    <!-- Browser screenshots cannot capture AppKit behind-window blur. Use a
         neutral backing, never a wallpaper that pretends to be native glass. -->
    <style>html:not([data-readme-native='true']) { background-color: var(--tokyo-bg, #101319) !important; }</style>
  </head>
  <body>
    <div id="root"></div>
    <div id="demo-label" style="position:fixed;bottom:8px;right:12px;z-index:100;pointer-events:none;padding:4px 8px;border:1px solid var(--tokyo-bg-hl);border-radius:4px;background:var(--tokyo-bg-dark);color:var(--tokyo-fg-dark);font:10px/1.4 monospace;">DEMO · example data</div>
    <script type="module">
      const fail = error => { document.getElementById('demo-label').textContent = 'CAPTURE ERROR: ' + String(error); import.meta.hot?.send('vibeshell:readme-report', {stage:'boot-error', error:String(error)}); };
      window.addEventListener('error', event => fail(event.error ?? event.message));
      window.addEventListener('unhandledrejection', event => fail(event.reason));
    </script>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
