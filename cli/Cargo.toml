[package]
name = "vshell"
version.workspace = true
edition.workspace = true

[[bin]]
name = "vibeshell"
path = "src/main.rs"

[dependencies]
vibeshell-core = { path = "../src-tauri", package = "vibeshell-desktop" }
clap = { version = "4", features = ["derive"] }
crossterm = "0.28"
serde.workspace = true
serde_json = "1"
tokio.workspace = true
anyhow.workspace = true
interprocess = "2"
