name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag on main (no automatic version bump)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate release and create draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      sha: ${{ steps.metadata.outputs.sha }}
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate immutable tag on main
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected an existing vX.Y.Z tag'; exit 1; }
          git fetch origin main --tags
          SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$SHA" origin/main
          git checkout --detach "$SHA"
          node scripts/check-release.mjs "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" > "$RUNNER_TEMP/checks.json"
          node - "$RUNNER_TEMP/checks.json" <<'NODE'
          const fs = require('node:fs');
          const checks = JSON.parse(fs.readFileSync(process.argv[2])).check_runs;
          for (const name of ['Frontend Check', 'Clippy Lint', 'Rust Check (ubuntu-22.04)', 'Rust Check (windows-latest)', 'Rust Check (macos-latest)']) {
            if (!checks.some(c => c.name === name && c.app.slug === 'github-actions' && c.conclusion === 'success')) {
              throw new Error(`Required CI has not passed for the tagged commit: ${name}`);
            }
          }
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate updater key cryptographically
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$TAURI_SIGNING_PRIVATE_KEY"
          sudo apt-get update
          sudo apt-get install -y minisign
          printf 'VibeShell updater signing preflight\n' > "$RUNNER_TEMP/signing-probe.txt"
          npx --no-install tauri signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$RUNNER_TEMP/signing-probe.txt"
          python3 scripts/verify-updater.py "$RUNNER_TEMP/signing-probe.txt"
      - name: Create or resume draft only
        run: |
          set -euo pipefail
          if gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/release.json" 2>/dev/null; then
            node -e 'if (!JSON.parse(require("node:fs").readFileSync(process.argv[1])).isDraft) throw new Error("Refusing to overwrite a published release")' "$RUNNER_TEMP/release.json"
          else
            gh release create "$TAG" --draft --verify-tag --title "VibeShell ${TAG#v}" --notes-file CHANGELOG.md
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$TARGET"
      - run: npm ci
      - name: Build native CLI and desktop
        shell: bash
        env:
          VIBESHELL_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          VIBESHELL_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          VIBESHELL_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          VIBESHELL_APPLE_ID: ${{ secrets.APPLE_ID }}
          VIBESHELL_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          VIBESHELL_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            indirect="VIBESHELL_$name"
            if [[ -n "${!indirect:-}" ]]; then export "$name=${!indirect}"; fi
          done
          node scripts/prepare-sidecar.mjs --target "$TARGET"
          npx --no-install tauri build --ci --target "$TARGET" --bundles "$BUNDLES" --config src-tauri/tauri.sidecar.conf.json -- --locked
      - name: Finalize macOS resources and updater archive
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          bundle="target/$TARGET/release/bundle"
          app="$bundle/macos/VibeShell.app"
          if [[ -z "$APPLE_CERTIFICATE" && -z "$APPLE_SIGNING_IDENTITY" ]]; then
            codesign --force --sign - "$app/Contents/MacOS/vibeshell"
            codesign --force --sign - "$app"
            staging=$(mktemp -d)
            ditto "$app" "$staging/VibeShell.app"
            ln -s /Applications "$staging/Applications"
            for dmg in "$bundle"/dmg/*.dmg; do
              hdiutil create -volname VibeShell -srcfolder "$staging" -ov -format UDZO "$dmg"
            done
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          archive="$bundle/macos/VibeShell.app.tar.gz"
          tar -czf "$archive" -C "$bundle/macos" VibeShell.app
          npx --no-install tauri signer sign --private-key "$TAURI_SIGNING_PRIVATE_KEY" --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$archive"
      - name: Collect artifacts and licensed CLI archive
        shell: bash
        run: python scripts/collect-release.py "$TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: target/release-assets/*
          if-no-files-found: error
          retention-days: 7

  source:
    name: Corresponding source materials
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: python scripts/package-source.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-source
          path: target/release-assets/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Verify all assets and publish
    needs: [prepare, build, source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.prepare.outputs.tag }}
      VERSION: ${{ needs.prepare.outputs.version }}
      HAS_APPLE_SIGNING: ${{ secrets.APPLE_CERTIFICATE != '' || secrets.APPLE_SIGNING_IDENTITY != '' }}
      HAS_APPLE_NOTARIZATION: ${{ secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Verify and generate updater manifest
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y minisign
          python3 scripts/verify-updater.py assets
          node scripts/generate-latest-json.js assets "$VERSION" "$TAG" "$GITHUB_REPOSITORY"
          test -s "assets/VibeShell-Source-$VERSION.tar.gz"
          cp LICENSE NOTICE assets/
          cp licenses/legacy-MIT.txt assets/legacy-MIT.txt
          (cd assets && sha256sum ./* > SHA256SUMS.txt)
      - name: Publish only after all required jobs succeed
        run: |
          set -euo pipefail
          gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/release.json"
          node -e 'if (!JSON.parse(require("node:fs").readFileSync(process.argv[1])).isDraft) throw new Error("Release is no longer a draft")' "$RUNNER_TEMP/release.json"
          cp CHANGELOG.md "$RUNNER_TEMP/notes.md"
          printf '\n## Downloads and source\n\nDesktop and native CLI assets are accompanied by VibeShell-Source-%s.tar.gz and SHA256SUMS.txt. The source bundle contains the exact tagged tree, vendored Rust dependencies, locked npm archives, build scripts and license notices.\n' "$VERSION" >> "$RUNNER_TEMP/notes.md"
          if [[ "$HAS_APPLE_SIGNING" != 'true' ]]; then
            printf '\nmacOS builds use ad-hoc signatures, not Developer ID signatures or Apple notarization.\n' >> "$RUNNER_TEMP/notes.md"
          elif [[ "$HAS_APPLE_NOTARIZATION" != 'true' ]]; then
            printf '\nApple signing is configured; Apple notarization credentials were not configured for this build.\n' >> "$RUNNER_TEMP/notes.md"
          else
            printf '\nApple signing and notarization were configured; successful bundling completed before publication.\n' >> "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$TAG" assets/* --clobber
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --draft=false --latest
