name: Release

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'cli/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/release.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump-and-release:
    name: Bump Version & Create Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'chore: bump version')"
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      version: ${{ steps.bump.outputs.new_version }}
      tag_name: ${{ steps.bump.outputs.tag_name }}
      should_build: ${{ steps.bump.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Bump version
        id: bump
        run: |
          CURRENT=$(jq -r .version src-tauri/tauri.conf.json)
          echo "Current version: $CURRENT"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NEW_VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Tag push: using version $NEW_VERSION"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            BUMP="${{ github.event.inputs.bump }}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              major) NEW_VERSION="$((MAJOR+1)).0.0" ;;
              minor) NEW_VERSION="${MAJOR}.$((MINOR+1)).0" ;;
              patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
            esac
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH+1))"
            echo "Branch push: auto bumping patch $CURRENT → $NEW_VERSION"
          fi

          TAG_NAME="v${NEW_VERSION}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "should_build=true" >> $GITHUB_OUTPUT

          # Update version in config files (only for non-tag pushes)
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            jq --arg v "$NEW_VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
            npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version
            sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" Cargo.toml
            cargo update -p vibeshell -p vshell
          fi

      - name: Commit version bump
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No version changes to commit"
          else
            git add src-tauri/tauri.conf.json package.json package-lock.json Cargo.toml Cargo.lock
            git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Create release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.bump.outputs.tag_name }}
        run: |
          cat > release-notes.md <<'EOF'
          ## VibeShell ${{ steps.bump.outputs.tag_name }}

          ### Downloads
          | Platform | Installer | CLI Only |
          |----------|-----------|----------|
          | Windows x64 | `.exe` / `.msi` | `vshell-windows-x64.exe` |
          | macOS (Apple Silicon) | `.dmg` | `vshell-macos-arm64` |
          | macOS (Intel) | `.dmg` | `vshell-macos-x64` |
          | Linux x64 | `.deb` / `.AppImage` | `vshell-linux-x64` |

          > **Note:** The desktop installer includes `vshell` CLI and adds it to your PATH automatically.

          See [commit history](https://github.com/${{ github.repository }}/commits/${{ steps.bump.outputs.tag_name }}) for full changes.
          EOF

          if gh release view "$TAG_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --repo "${{ github.repository }}" \
              --title "VibeShell $TAG_NAME" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$TAG_NAME" \
              --repo "${{ github.repository }}" \
              --target "$(git rev-parse HEAD)" \
              --title "VibeShell $TAG_NAME" \
              --notes-file release-notes.md \
              --latest
          fi

          RELEASE_ID="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG_NAME" --jq .id)"
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build-tauri:
    name: Build (${{ matrix.name }})
    needs: bump-and-release
    if: needs.bump-and-release.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: Windows x64
            args: ''
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            name: macOS ARM64
            args: '--target aarch64-apple-darwin'
            target: aarch64-apple-darwin
          - platform: macos-latest
            name: macOS x64
            args: '--target x86_64-apple-darwin'
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            name: Linux x64
            args: ''
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-and-release.outputs.tag_name }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        shell: bash
        env:
          VIBESHELL_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          VIBESHELL_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          VIBESHELL_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          VIBESHELL_APPLE_ID: ${{ secrets.APPLE_ID }}
          VIBESHELL_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          VIBESHELL_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          VIBESHELL_APPLE_PROVIDER_SHORT_NAME: ${{ secrets.APPLE_PROVIDER_SHORT_NAME }}
        run: |
          if [[ -n "${VIBESHELL_APPLE_CERTIFICATE:-}" ]]; then
            export APPLE_CERTIFICATE="$VIBESHELL_APPLE_CERTIFICATE"
          fi
          if [[ -n "${VIBESHELL_APPLE_CERTIFICATE_PASSWORD:-}" ]]; then
            export APPLE_CERTIFICATE_PASSWORD="$VIBESHELL_APPLE_CERTIFICATE_PASSWORD"
          fi
          if [[ -n "${VIBESHELL_APPLE_SIGNING_IDENTITY:-}" ]]; then
            export APPLE_SIGNING_IDENTITY="$VIBESHELL_APPLE_SIGNING_IDENTITY"
          fi
          if [[ -n "${VIBESHELL_APPLE_ID:-}" ]]; then
            export APPLE_ID="$VIBESHELL_APPLE_ID"
          fi
          if [[ -n "${VIBESHELL_APPLE_PASSWORD:-}" ]]; then
            export APPLE_PASSWORD="$VIBESHELL_APPLE_PASSWORD"
          fi
          if [[ -n "${VIBESHELL_APPLE_TEAM_ID:-}" ]]; then
            export APPLE_TEAM_ID="$VIBESHELL_APPLE_TEAM_ID"
          fi
          if [[ -n "${VIBESHELL_APPLE_PROVIDER_SHORT_NAME:-}" ]]; then
            export APPLE_PROVIDER_SHORT_NAME="$VIBESHELL_APPLE_PROVIDER_SHORT_NAME"
          fi

          npx tauri build ${{ matrix.args }}

      - name: Repair unsigned macOS app bundle
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          VIBESHELL_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          VIBESHELL_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          VERSION: ${{ needs.bump-and-release.outputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          if [[ -n "${VIBESHELL_APPLE_CERTIFICATE:-}" || -n "${VIBESHELL_APPLE_SIGNING_IDENTITY:-}" ]]; then
            echo "Apple signing is configured; keeping Tauri's signed and notarized bundles."
            exit 0
          fi

          app_candidates=(
            "target/${TARGET}/release/bundle/macos/VibeShell.app"
            "target/release/bundle/macos/VibeShell.app"
          )
          APP_PATH=""
          for candidate in "${app_candidates[@]}"; do
            if [ -d "$candidate" ]; then
              APP_PATH="$candidate"
              break
            fi
          done

          if [ -z "$APP_PATH" ]; then
            echo "VibeShell.app not found. Checked:"
            printf '  %s\n' "${app_candidates[@]}"
            exit 1
          fi

          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

          bundle_root="$(dirname "$(dirname "$APP_PATH")")"
          dmg_dir="${bundle_root}/dmg"
          mkdir -p "$dmg_dir"
          find "$dmg_dir" -maxdepth 1 -type f -name "*.dmg" -delete

          arch="x64"
          if [[ "$TARGET" == *"aarch64"* ]]; then
            arch="aarch64"
          fi

          staging_dir="$(mktemp -d)"
          ditto "$APP_PATH" "${staging_dir}/VibeShell.app"
          ln -s /Applications "${staging_dir}/Applications"
          hdiutil create \
            -volname "VibeShell" \
            -srcfolder "$staging_dir" \
            -ov \
            -format UDZO \
            "${dmg_dir}/VibeShell_${VERSION}_${arch}.dmg"

      - name: Collect and upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.bump-and-release.outputs.version }}"
          TAG_NAME="${{ needs.bump-and-release.outputs.tag_name }}"
          TARGET="${{ matrix.target }}"
          EXT=""

          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            EXT=".exe"
          fi

          binary_candidates=(
            "target/${TARGET}/release/vshell${EXT}"
            "target/release/vshell${EXT}"
          )
          BINARY=""
          for candidate in "${binary_candidates[@]}"; do
            if [ -f "$candidate" ]; then
              BINARY="$candidate"
              break
            fi
          done

          bundle_dirs=(
            "target/${TARGET}/release/bundle"
            "target/release/bundle"
          )

          # Determine platform-friendly name
          case "${{ matrix.platform }}" in
            windows-latest)
              DEST="vshell-${VERSION}-windows-x64.exe"
              ;;
            macos-latest)
              if [[ "${{ matrix.args }}" == *"aarch64"* ]]; then
                DEST="vshell-${VERSION}-macos-arm64"
              else
                DEST="vshell-${VERSION}-macos-x64"
              fi
              ;;
            ubuntu-22.04)
              DEST="vshell-${VERSION}-linux-x64"
              ;;
          esac

          if [ -n "$BINARY" ]; then
            cp "$BINARY" "$DEST"
            chmod +x "$DEST" 2>/dev/null || true
          else
            echo "vshell binary not found. Checked:"
            printf '  %s\n' "${binary_candidates[@]}"
            exit 1
          fi

          uploads=("$DEST")
          for bundle_dir in "${bundle_dirs[@]}"; do
            if [ ! -d "$bundle_dir" ]; then
              continue
            fi

            while IFS= read -r -d '' file; do
              upload="$file"

              if [[ "${{ matrix.platform }}" == "macos-latest" && "$file" == *.dmg ]]; then
                if [[ "${{ matrix.args }}" == *"aarch64"* ]]; then
                  upload="VibeShell-${VERSION}-macos-arm64.dmg"
                else
                  upload="VibeShell-${VERSION}-macos-x64.dmg"
                fi
                cp "$file" "$upload"
              fi

              uploads+=("$upload")
            done < <(find "$bundle_dir" -type f \( \
              -name "*.AppImage" -o \
              -name "*.deb" -o \
              -name "*.dmg" -o \
              -name "*.exe" -o \
              -name "*.msi" -o \
              -name "*.rpm" \
            \) -print0)
          done

          if [ "${#uploads[@]}" -lt 2 ]; then
            echo "No desktop installer artifacts found. Checked bundle dirs:"
            printf '  %s\n' "${bundle_dirs[@]}"
            find target -maxdepth 5 -type f 2>/dev/null | sort || true
            exit 1
          fi

          printf 'Uploading release assets:\n'
          printf '  %s\n' "${uploads[@]}"
          gh release upload "$TAG_NAME" "${uploads[@]}" --repo "${{ github.repository }}" --clobber
