name: Release

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'src/**'
      - 'src-tauri/**'
      - 'cli/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'postcss.config.js'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/release.yml'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type'
        required: false
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bump-and-release:
    name: Bump Version & Create Release
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, 'chore: bump version')"
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      version: ${{ steps.bump.outputs.new_version }}
      tag_name: ${{ steps.bump.outputs.tag_name }}
      should_build: ${{ steps.bump.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Bump version
        id: bump
        run: |
          CURRENT=$(jq -r .version src-tauri/tauri.conf.json)
          echo "Current version: $CURRENT"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NEW_VERSION="${GITHUB_REF#refs/tags/v}"
            echo "Tag push: using version $NEW_VERSION"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            BUMP="${{ github.event.inputs.bump }}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              major) NEW_VERSION="$((MAJOR+1)).0.0" ;;
              minor) NEW_VERSION="${MAJOR}.$((MINOR+1)).0" ;;
              patch) NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
            esac
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH+1))"
            echo "Branch push: auto bumping patch $CURRENT → $NEW_VERSION"
          fi

          TAG_NAME="v${NEW_VERSION}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "should_build=true" >> $GITHUB_OUTPUT

          # Update version in config files (only for non-tag pushes)
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            jq --arg v "$NEW_VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
            npm version "$NEW_VERSION" --no-git-tag-version --allow-same-version
            sed -i "s/^version = \".*\"/version = \"$NEW_VERSION\"/" Cargo.toml
          fi

      - name: Commit version bump
        if: "!startsWith(github.ref, 'refs/tags/')"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No version changes to commit"
          else
            git add src-tauri/tauri.conf.json package.json package-lock.json Cargo.toml
            git commit -m "chore: bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Create release
        id: create_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.bump.outputs.tag_name }}
        run: |
          cat > release-notes.md <<'EOF'
          ## VibeShell ${{ steps.bump.outputs.tag_name }}

          ### Downloads
          | Platform | Installer | CLI Only |
          |----------|-----------|----------|
          | Windows x64 | `.exe` / `.msi` | `vshell-windows-x64.exe` |
          | macOS (Apple Silicon) | `.dmg` | `vshell-macos-arm64` |
          | macOS (Intel) | `.dmg` | `vshell-macos-x64` |
          | Linux x64 | `.deb` / `.AppImage` | `vshell-linux-x64` |

          > **Note:** The desktop installer includes `vshell` CLI and adds it to your PATH automatically.

          See [commit history](https://github.com/${{ github.repository }}/commits/${{ steps.bump.outputs.tag_name }}) for full changes.
          EOF

          if gh release view "$TAG_NAME" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --repo "${{ github.repository }}" \
              --title "VibeShell $TAG_NAME" \
              --notes-file release-notes.md \
              --latest
          else
            gh release create "$TAG_NAME" \
              --repo "${{ github.repository }}" \
              --target "$(git rev-parse HEAD)" \
              --title "VibeShell $TAG_NAME" \
              --notes-file release-notes.md \
              --latest
          fi

          RELEASE_ID="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG_NAME" --jq .id)"
          echo "id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  build-tauri:
    name: Build (${{ matrix.name }})
    needs: bump-and-release
    if: needs.bump-and-release.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            name: Windows x64
            args: ''
            target: x86_64-pc-windows-msvc
          - platform: macos-latest
            name: macOS ARM64
            args: '--target aarch64-apple-darwin'
            target: aarch64-apple-darwin
          - platform: macos-latest
            name: macOS x64
            args: '--target x86_64-apple-darwin'
            target: x86_64-apple-darwin
          - platform: ubuntu-22.04
            name: Linux x64
            args: ''
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            wget \
            file \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libxdo-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust stable
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          if [[ "${{ matrix.platform }}" == "macos-latest" ]]; then
            rustup target add aarch64-apple-darwin x86_64-apple-darwin
          fi

      - name: Install frontend dependencies
        run: npm ci

      - name: Build vshell CLI
        shell: bash
        run: |
          if [[ "${{ matrix.target }}" != "" && "${{ matrix.args }}" == *"--target"* ]]; then
            cargo build --release --package vshell --target ${{ matrix.target }}
          else
            cargo build --release --package vshell
          fi

      - name: Copy vshell to sidecar location
        shell: bash
        run: |
          mkdir -p src-tauri/binaries
          TARGET="${{ matrix.target }}"
          EXT=""
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            EXT=".exe"
          fi

          # Determine source path
          if [[ "${{ matrix.args }}" == *"--target"* ]]; then
            SRC="target/${TARGET}/release/vshell${EXT}"
          else
            SRC="target/release/vshell${EXT}"
          fi

          DEST="src-tauri/binaries/vshell-${TARGET}${EXT}"

          echo "Copying $SRC -> $DEST"
          cp "$SRC" "$DEST"
          chmod +x "$DEST" 2>/dev/null || true
          ls -la src-tauri/binaries/

      - name: Build Tauri app
        shell: bash
        run: |
          npx tauri build ${{ matrix.args }}

      - name: Collect and upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.bump-and-release.outputs.version }}"
          TAG_NAME="${{ needs.bump-and-release.outputs.tag_name }}"
          TARGET="${{ matrix.target }}"
          EXT=""

          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            EXT=".exe"
          fi

          # Find the built vshell binary
          if [[ "${{ matrix.args }}" == *"--target"* ]]; then
            BINARY="target/${TARGET}/release/vshell${EXT}"
          else
            BINARY="target/release/vshell${EXT}"
          fi

          if [[ "${{ matrix.args }}" == *"--target"* ]]; then
            BUNDLE_DIR="target/${TARGET}/release/bundle"
          else
            BUNDLE_DIR="target/release/bundle"
          fi

          # Determine platform-friendly name
          case "${{ matrix.platform }}" in
            windows-latest)
              DEST="vshell-${VERSION}-windows-x64.exe"
              ;;
            macos-latest)
              if [[ "${{ matrix.args }}" == *"aarch64"* ]]; then
                DEST="vshell-${VERSION}-macos-arm64"
              else
                DEST="vshell-${VERSION}-macos-x64"
              fi
              ;;
            ubuntu-22.04)
              DEST="vshell-${VERSION}-linux-x64"
              ;;
          esac

          if [ -f "$BINARY" ]; then
            cp "$BINARY" "$DEST"
            chmod +x "$DEST" 2>/dev/null || true
          else
            echo "vshell binary not found at $BINARY"
            exit 1
          fi

          uploads=("$DEST")
          if [ -d "$BUNDLE_DIR" ]; then
            while IFS= read -r -d '' file; do
              uploads+=("$file")
            done < <(find "$BUNDLE_DIR" -type f \( \
              -name "*.AppImage" -o \
              -name "*.deb" -o \
              -name "*.dmg" -o \
              -name "*.exe" -o \
              -name "*.msi" -o \
              -name "*.rpm" \
            \) -print0)
          fi

          if [ "${#uploads[@]}" -lt 2 ]; then
            echo "No desktop installer artifacts found under $BUNDLE_DIR"
            find target -maxdepth 5 -type f 2>/dev/null | sort || true
            exit 1
          fi

          printf 'Uploading release assets:\n'
          printf '  %s\n' "${uploads[@]}"
          gh release upload "$TAG_NAME" "${uploads[@]}" --repo "${{ github.repository }}" --clobber
